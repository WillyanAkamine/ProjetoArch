version: '3.8'

services:
  web:
    build: .
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
    user: "${UID}:${GID}"
    environment:
      - APACHE_RUN_USER=www-data
      - APACHE_RUN_GROUP=www-data
    depends_on:
      db:
        condition: service_healthy # Espera o MySQL estar online
    # entrypoint: >
    #   bash -c "
    #     ./vendor/bin/doctrine-migrations migrate --no-interaction &&
    #     php seed.php &&
    #     apache2-foreground
    #   "

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: admin
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:                        # ✅ verifica quando o MySQL está pronto
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-padmin"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data: